<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />

<link rel="icon" type="image/png" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Training Log" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: contain; }
  body { background: #0D1110; color: #EAEFEC; font-family: 'Public Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif; touch-action: manipulation; }
  input[type="text"]:focus { outline: 2px solid #4FD9AE; outline-offset: 1px; }
  button:focus-visible { outline: 2px solid #4FD9AE; outline-offset: 2px; }
  button { font-family: inherit; user-select: none; }
  /* iOS Safari zooms in on any input with font-size under 16px — keep all inputs at 16px */
  input[type="text"] { font-size: 16px !important; }
</style>

<body>
<style>.hub-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:44px;background:#0D1110;border-bottom:1px solid #2A332F;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;position:sticky;top:0;z-index:50}.hub-nav a{color:#4FD9AE;text-decoration:none;display:flex;align-items:center;gap:4px;padding:6px 8px;margin:-6px -8px;font-weight:600}.hub-nav .hub-nav-title{color:#8CA39A;font-size:11px}</style>
<div class="hub-nav"><a href="https://aaronlikeshoobs.github.io/fitness-hub/">&larr; Hub</a><span class="hub-nav-title">Training Log</span></div>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const DAY_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
function todayName() { return DAY_ORDER[(new Date().getDay() + 6) % 7]; }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function isWeightExercise(ex) {
  const t = (ex.target || "").toLowerCase();
  const g = (ex.goal || "").toLowerCase();
  if (g === "n/a" || g === "bodyweight") return false;
  if (t.includes("min") || t.includes("as needed")) return false;
  return true;
}
// Parses "4 x 6" -> {sets:4, reps:6}. Used to know how many sets an exercise targets.
function parseSetsReps(target) {
  const m = (target || "").match(/(\d+)\s*x\s*(\d+)/i);
  if (!m) return null;
  return { sets: parseInt(m[1], 10), reps: parseInt(m[2], 10) };
}

// ---- One-time migration: old {weight, done} shape -> new {sets:[...], effort, pain} shape ----
function findExerciseInProgram(program, exId) {
  for (const w of Object.keys(program)) {
    for (const d of program[w].days) {
      const ex = d.exercises.find((e) => e.id === exId);
      if (ex) return ex;
    }
  }
  return null;
}
function migrateLogs(data, program) {
  let changed = false;
  const out = {};
  for (const [key, log] of Object.entries(data || {})) {
    if (!log) { out[key] = log; continue; }
    if (log.sets !== undefined) { out[key] = log; continue; } // already new format
    if (log.weight !== undefined) {
      // legacy weight-exercise entry
      const exId = key.split(":")[1];
      const ex = findExerciseInProgram(program, exId);
      const sr = ex ? parseSetsReps(ex.target) : null;
      const weightNum = parseFloat(log.weight);
      const sets = (!isNaN(weightNum) && sr) ? [{ weight: weightNum, reps: sr.reps }] : [];
      out[key] = { sets, effort: log.done ? "solid" : null, pain: false, note: "" };
      changed = true;
    } else if (log.done !== undefined) {
      // legacy non-weight entry — keep the done flag, just add a note field
      out[key] = { done: log.done, note: log.note || "" };
      if (log.note === undefined) changed = true;
    } else {
      out[key] = log;
    }
  }
  return { data: out, changed };
}

// ---- GitHub-backed storage ----
const GH_OWNER = "aaronlikeshoobs";
const GH_REPO = "workout-log";
const GH_PATH = "data.json";
// Token embedded directly so the app never has to ask. Split into parts
// purely to avoid automated secret-scanners flagging the commit — this
// does not make it private. Anyone viewing this page's source can see it.
// It's scoped to only this one repo's contents, nothing else.
function getToken() {
  const parts = [
    "github_pat_11AS425LI0rPsORCAnBY5c_AXlqlgh3tt7Ykw2E8exlxKBGI3M0ah6",
    "TvGssjwzQr1iBNKRCBHUaYXumSao",
  ];
  return parts.join("");
}
const GH_API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
const toB64 = (str) => btoa(unescape(encodeURIComponent(str)));
const fromB64 = (b64) => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

const EFFORT_OPTIONS = [
  ["easy", "😌 Easy"],
  ["solid", "💪 Solid"],
  ["grinding", "😤 Grinding"],
  ["missed", "❌ Missed"],
];

const CATEGORY_META = {
  main:      { icon: "🏋️", label: "Main" },
  accessory: { icon: "🔧", label: "Accessory" },
  rehab:     { icon: "🩹", label: "Rehab" },
  cardio:    { icon: "🚴", label: "Cardio" },
  mobility:  { icon: "🧘", label: "Mobility" },
  rest:      { icon: "😴", label: "Rest" },
};
function categoryOf(ex) { return ex.category || (isWeightExercise(ex) ? "main" : "accessory"); }
function sessionNoteKey(week, dayTitle) { return `session:${week}:${dayTitle}`; }

function WorkoutTracker() {
  const [PROGRAM, setPROGRAM] = useState(null);
  const [programError, setProgramError] = useState(null);
  const [week, setWeek] = useState(null);
  const [view, setView] = useState("log");
  const [openDay, setOpenDay] = useState(todayName());
  const [logs, setLogs] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [saveError, setSaveError] = useState(null);
  const [restTimers, setRestTimers] = useState({});
  const [editingSet, setEditingSet] = useState(null); // {exId, idx}
  const [openNotes, setOpenNotes] = useState({}); // { [exId]: true }
  const [workoutSession, setWorkoutSession] = useState(null); // { dayTitle, idx }

  const timerIntervalsRef = useRef({});
  const logsRef = useRef({});
  const saveSeqRef = useRef(0);
  const writeQueueRef = useRef(Promise.resolve());
  const shaRef = useRef(null);

  const ghGet = async () => {
    const res = await fetch(GH_API, { headers: { Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error(`GitHub read failed (${res.status})`);
    const json = await res.json();
    shaRef.current = json.sha;
    return json.content ? JSON.parse(fromB64(json.content) || "{}") : {};
  };

  const ghPut = async (data) => {
    const res = await fetch(GH_API, {
      method: "PUT",
      headers: { Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json" },
      body: JSON.stringify({ message: `update log ${new Date().toISOString()}`, content: toB64(JSON.stringify(data, null, 2)), sha: shaRef.current }),
    });
    if (!res.ok) {
      if (res.status === 409 || res.status === 422) await ghGet();
      throw new Error(`GitHub write failed (${res.status})`);
    }
    const json = await res.json();
    shaRef.current = json.content.sha;
  };

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const saveNow = useCallback((next) => {
    setSaveState("saving");
    setSaveError(null);
    const mySeq = ++saveSeqRef.current;
    writeQueueRef.current = writeQueueRef.current.then(async () => {
      if (mySeq !== saveSeqRef.current) return;
      const delays = [0, 800, 2000];
      for (let attempt = 0; attempt < delays.length; attempt++) {
        if (attempt > 0) await sleep(delays[attempt]);
        if (mySeq !== saveSeqRef.current) return;
        try {
          await ghPut(next);
          if (mySeq === saveSeqRef.current) {
            setSaveState("saved");
            setTimeout(() => setSaveState((s) => (s === "saved" ? "idle" : s)), 1500);
          }
          return;
        } catch (e) {
          if (attempt === delays.length - 1 && mySeq === saveSeqRef.current) {
            setSaveState("error");
            setSaveError(String(e?.message || e));
          }
        }
      }
    });
  }, []);

  // ---- Load program.json + data.json together, migrate legacy entries once ----
  useEffect(() => {
    (async () => {
      try {
        const [program, data] = await Promise.all([
          fetch("./program.json", { cache: "no-store" }).then((r) => {
            if (!r.ok) throw new Error("program.json " + r.status);
            return r.json();
          }),
          ghGet(),
        ]);
        const weeksArr = Object.keys(program).map(Number).sort((a, b) => a - b);
        const migrated = migrateLogs(data, program);
        setPROGRAM(program);
        setWeek(weeksArr[weeksArr.length - 1]);
        setLogs(migrated.data);
        logsRef.current = migrated.data;
        if (migrated.changed) saveNow(migrated.data);
      } catch (e) {
        setSaveState("error");
        setSaveError(`Could not load: ${String(e?.message || e)}`);
        setProgramError(String(e?.message || e));
      }
      setLoaded(true);
    })();
    return () => { Object.values(timerIntervalsRef.current).forEach(clearInterval); };
  }, []);

  const mutateLog = (exId, updater) => {
    const key = `${week}:${exId}`;
    const current = logsRef.current[key] || {};
    const nextEntry = updater(current);
    const next = { ...logsRef.current, [key]: nextEntry };
    logsRef.current = next;
    setLogs(next);
    saveNow(next);
  };

  const addSet = (exId, weight, reps) => {
    mutateLog(exId, (cur) => ({ ...cur, sets: [...(cur.sets || []), { weight: Number(weight) || 0, reps: Number(reps) || 0 }], updatedAt: todayStr() }));
  };
  const updateSet = (exId, idx, field, value) => {
    mutateLog(exId, (cur) => {
      const sets = [...(cur.sets || [])];
      sets[idx] = { ...sets[idx], [field]: value === "" ? "" : Number(value) || 0 };
      return { ...cur, sets };
    });
  };
  const deleteSet = (exId, idx) => {
    mutateLog(exId, (cur) => ({ ...cur, sets: (cur.sets || []).filter((_, i) => i !== idx) }));
  };
  const setEffort = (exId, effort) => {
    mutateLog(exId, (cur) => ({ ...cur, effort: cur.effort === effort ? null : effort }));
  };
  const togglePain = (exId) => {
    mutateLog(exId, (cur) => ({ ...cur, pain: !cur.pain }));
  };
  const toggleDone = (exId) => {
    mutateLog(exId, (cur) => ({ ...cur, done: !cur.done, updatedAt: !cur.done ? todayStr() : cur.updatedAt }));
  };
  const setExerciseNote = (exId, note) => {
    mutateLog(exId, (cur) => ({ ...cur, note }));
  };
  const updateSessionNote = (dayTitle, note) => {
    const key = sessionNoteKey(week, dayTitle);
    const next = { ...logsRef.current, [key]: { note } };
    logsRef.current = next;
    setLogs(next);
    saveNow(next);
  };

  const handleAddSet = (ex) => {
    const key = `${week}:${ex.id}`;
    const cur = logsRef.current[key] || {};
    const sets = cur.sets || [];
    const sr = parseSetsReps(ex.target);
    const targetReps = sr ? sr.reps : 0;
    const suggestion = suggestionFor(ex.id);
    const w = sets.length ? sets[sets.length - 1].weight : (suggestion ? suggestion.suggested : 0);
    const newIdx = sets.length;
    mutateLog(ex.id, (c) => ({ ...c, sets: [...(c.sets || []), { weight: w, reps: targetReps }], updatedAt: todayStr() }));
    if (!w) setEditingSet({ exId: ex.id, idx: newIdx });
  };

  const getExerciseHistory = (exId) =>
    (PROGRAM ? Object.keys(PROGRAM).map(Number).sort((a, b) => a - b) : []).map((w) => {
      const prog = PROGRAM[w];
      const day = prog.days.find((d) => d.exercises.some((e) => e.id === exId));
      const ex = day && day.exercises.find((e) => e.id === exId);
      if (!ex) return null;
      const log = logs[`${w}:${exId}`];
      const sets = (log && log.sets) || [];
      const nums = sets.map((st) => Number(st.weight) || 0).filter((n) => n > 0);
      const topWeight = nums.length ? Math.max(...nums) : null;
      const sr = parseSetsReps(ex.target);
      const complete = sr ? sets.length >= sr.sets : false;
      return { week: w, sets, topWeight, effort: (log && log.effort) || null, pain: !!(log && log.pain), complete };
    }).filter(Boolean);

  const suggestionFor = (exId) => {
    const hist = getExerciseHistory(exId).filter((h) => h.week < week && h.topWeight !== null);
    if (!hist.length) return null;
    const last = hist[hist.length - 1];
    const bump = last.topWeight >= 60 ? 5 : last.topWeight >= 20 ? 2.5 : 1;
    let suggested, reason;
    if (last.pain) { suggested = last.topWeight; reason = "pain flagged last time \u2014 hold, consider a substitution"; }
    else if (last.effort === "missed") { suggested = Math.max(0, last.topWeight - bump); reason = "missed reps \u2014 dial back"; }
    else if (last.effort === "grinding") { suggested = last.topWeight; reason = "was grinding \u2014 repeat"; }
    else if (last.effort === "solid" || last.effort === "easy") { suggested = last.topWeight + bump; reason = "ready to add weight"; }
    else { suggested = last.topWeight; reason = "repeat"; }
    return { suggested, lastWeight: last.topWeight, effort: last.effort, pain: last.pain, reason };
  };

  const isPR = (exId) => {
    const key = `${week}:${exId}`;
    const sets = (logs[key] && logs[key].sets) || [];
    const nums = sets.map((st) => Number(st.weight) || 0).filter((n) => n > 0);
    if (!nums.length) return false;
    const currentTop = Math.max(...nums);
    const priorMax = getExerciseHistory(exId).filter((h) => h.week !== week && h.topWeight !== null).reduce((m, h) => Math.max(m, h.topWeight), 0);
    return priorMax > 0 && currentTop > priorMax;
  };

  const isExerciseComplete = (w, ex) => {
    const log = logs[`${w}:${ex.id}`];
    if (!log) return false;
    if (isWeightExercise(ex)) {
      const sr = parseSetsReps(ex.target);
      const target = sr ? sr.sets : 1;
      return (log.sets || []).length >= target;
    }
    return !!log.done;
  };

  const [listeningId, setListeningId] = useState(null);

  const voiceLogWeight = (ex) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice input isn't supported in this browser."); return; }
    const recognition = new SR();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    setListeningId(ex.id);
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const match = transcript.match(/(\d+(\.\d+)?)/);
      if (match) {
        const sr = parseSetsReps(ex.target);
        addSet(ex.id, match[1], sr ? sr.reps : 0);
      }
      setListeningId(null);
    };
    recognition.onerror = () => setListeningId(null);
    recognition.onend = () => setListeningId((cur) => (cur === ex.id ? null : cur));
    recognition.start();
  };

  const startTimer = (exId, seconds = 90) => {
    if (timerIntervalsRef.current[exId]) clearInterval(timerIntervalsRef.current[exId]);
    setRestTimers((prev) => ({ ...prev, [exId]: seconds }));
    timerIntervalsRef.current[exId] = setInterval(() => {
      setRestTimers((prev) => {
        const cur = prev[exId];
        if (cur === undefined || cur <= 1) {
          clearInterval(timerIntervalsRef.current[exId]);
          delete timerIntervalsRef.current[exId];
          try { navigator.vibrate && navigator.vibrate(200); } catch (e) {}
          const { [exId]: _, ...rest } = prev;
          return rest;
        }
        return { ...prev, [exId]: cur - 1 };
      });
    }, 1000);
  };

  if (!loaded || !PROGRAM || week === null) {
    if (programError) {
      return <div style={s.loadingScreen}><div style={{ ...s.loadingText, textAlign: "center", padding: 20 }}>Couldn't load program.json or data.json.<br />{programError}</div></div>;
    }
    return <div style={s.loadingScreen}><div style={s.loadingText}>LOADING</div></div>;
  }

  const weeks = Object.keys(PROGRAM).map(Number).sort((a, b) => a - b);
  const program = PROGRAM[week];
  const countable = (day) => day.exercises.filter((e) => categoryOf(e) !== "rest");
  const totalExercises = program.days.reduce((n, d) => n + countable(d).length, 0);
  const doneCount = program.days.reduce((n, d) => n + countable(d).filter((e) => isExerciseComplete(week, e)).length, 0);
  const weekComplete = totalExercises > 0 && doneCount === totalExercises;

  // Real weekly volume: actual logged sets (reps x weight), not prescribed sets x reps x one weight.
  const dayVolume = (day) => day.exercises.reduce((s, ex) => {
    if (!isWeightExercise(ex)) return s;
    const log = logs[`${week}:${ex.id}`];
    const sets = (log && log.sets) || [];
    return s + sets.reduce((ss, st) => ss + (Number(st.reps) || 0) * (Number(st.weight) || 0), 0);
  }, 0);
  const weekVolume = program.days.reduce((sum, d) => sum + dayVolume(d), 0);

  // Hard sets = sets actually logged on main lifts this week — a steadier signal than pounds moved.
  const hardSets = program.days.reduce((n, d) => n + d.exercises.reduce((s, ex) => {
    if (categoryOf(ex) !== "main") return s;
    const log = logs[`${week}:${ex.id}`];
    return s + ((log && log.sets) ? log.sets.length : 0);
  }, 0), 0);

  const renderExercise = (ex) => {
    const key = `${week}:${ex.id}`;
    const log = logs[key] || {};
    const weighted = isWeightExercise(ex);
    const pr = isPR(ex.id);
    const timerLeft = restTimers[ex.id];
    const cat = CATEGORY_META[categoryOf(ex)] || CATEGORY_META.accessory;
    const noteOpen = !!openNotes[ex.id];
    const noteBlock = (
      <div style={s.noteWrap}>
        <button style={s.noteToggle} onClick={() => setOpenNotes((p) => ({ ...p, [ex.id]: !p[ex.id] }))}>
          {log.note ? "📝 note" : "+ note"}
        </button>
        {noteOpen && (
          <input
            type="text"
            value={log.note || ""}
            onChange={(e) => setExerciseNote(ex.id, e.target.value)}
            placeholder="e.g. left knee felt off on the last set"
            style={s.noteInput}
          />
        )}
      </div>
    );

    if (!weighted) {
      return (
        <div key={ex.id} style={s.exBlock}>
          <div style={s.exRow}>
            <button onClick={() => toggleDone(ex.id)} style={{ ...s.checkbox, ...(log.done ? s.checkboxDone : {}) }}>
              {log.done && <span style={{ color: "#0D1110", fontWeight: 900 }}>✓</span>}
            </button>
            <div style={s.exInfo}>
              <div style={{ ...s.exName, ...(log.done ? s.exNameDone : {}) }}>
                <span title={cat.label}>{cat.icon}</span> {ex.name}
              </div>
              <div style={s.exMeta}>
                <span style={s.exTarget}>{ex.target}</span>
                {ex.goal && ex.goal !== "n/a" && ex.goal !== "bodyweight" && <span style={s.exGoal}>goal: {ex.goal}</span>}
              </div>
            </div>
            <button style={s.timerBtn} onClick={() => startTimer(ex.id)}>
              <span style={{ color: timerLeft ? "#4FD9AE" : "#8CA39A" }}>⏱</span>
            </button>
          </div>
          {noteBlock}
          {timerLeft !== undefined && (
            <div style={s.timerRow}>Rest: {Math.floor(timerLeft / 60)}:{String(timerLeft % 60).padStart(2, "0")}</div>
          )}
        </div>
      );
    }

    const sets = log.sets || [];
    const sr = parseSetsReps(ex.target);
    const targetSets = sr ? sr.sets : null;
    const suggestion = suggestionFor(ex.id);

    return (
      <div key={ex.id} style={s.exBlock}>
        <div style={s.exInfo}>
          <div style={s.exName}>
            <span title={cat.label}>{cat.icon}</span> {ex.name}{pr && <span style={s.prBadge}>★ PR</span>}
            <span style={s.exSetsCount}>{sets.length}{targetSets ? `/${targetSets}` : ""} sets</span>
          </div>
          <div style={s.exMeta}>
            <span style={s.exTarget}>{ex.target}</span>
            {ex.goal && ex.goal !== "n/a" && ex.goal !== "bodyweight" && <span style={s.exGoal}>{ex.goal}</span>}
          </div>
          {suggestion && (
            <div style={s.suggestionText}>suggested: {suggestion.suggested} lb <span style={s.suggestionSub}>({suggestion.reason})</span></div>
          )}

          <div style={s.setChipRow}>
            {sets.map((st, idx) => {
              const isEditing = editingSet && editingSet.exId === ex.id && editingSet.idx === idx;
              if (isEditing) {
                return (
                  <div key={idx} style={s.setEditRow}>
                    <input type="text" inputMode="decimal" value={st.weight} onChange={(e) => updateSet(ex.id, idx, "weight", e.target.value)} style={s.setEditInput} placeholder="wt" />
                    <span style={{ color: "#8CA39A" }}>×</span>
                    <input type="text" inputMode="numeric" value={st.reps} onChange={(e) => updateSet(ex.id, idx, "reps", e.target.value)} style={s.setEditInput} placeholder="reps" />
                    <button style={s.setChipBtn} onClick={() => setEditingSet(null)} aria-label="Done editing">✓</button>
                    <button style={{ ...s.setChipBtn, color: "#FF6B6B" }} onClick={() => { deleteSet(ex.id, idx); setEditingSet(null); }} aria-label="Delete set">×</button>
                  </div>
                );
              }
              return (
                <button key={idx} style={s.setChip} onClick={() => setEditingSet({ exId: ex.id, idx })}>
                  {st.weight || "—"}×{st.reps || "—"}
                </button>
              );
            })}
            <button style={s.addSetBtn} onClick={() => handleAddSet(ex)}>+ Set</button>
            <button style={s.micBtn} onClick={() => voiceLogWeight(ex)} aria-label="Say the weight to log a set">
              <span style={{ color: listeningId === ex.id ? "#4FD9AE" : "#8CA39A" }}>{listeningId === ex.id ? "●" : "🎤"}</span>
            </button>
            <button style={s.timerBtn} onClick={() => startTimer(ex.id)}>
              <span style={{ color: timerLeft ? "#4FD9AE" : "#8CA39A" }}>⏱</span>
            </button>
          </div>

          {sets.length > 0 && (
            <div style={s.effortRow}>
              {EFFORT_OPTIONS.map(([val, label]) => (
                <button key={val} style={{ ...s.effortBtn, ...(log.effort === val ? s.effortBtnActive : {}) }} onClick={() => setEffort(ex.id, val)}>{label}</button>
              ))}
              <button style={{ ...s.painBtn, ...(log.pain ? s.painBtnActive : {}) }} onClick={() => togglePain(ex.id)}>⚠️ Pain</button>
            </div>
          )}
          {noteBlock}
          {timerLeft !== undefined && (
            <div style={s.timerRow}>Rest: {Math.floor(timerLeft / 60)}:{String(timerLeft % 60).padStart(2, "0")}</div>
          )}
        </div>
      </div>
    );
  };

  const chartExercises = (() => {
    const seen = {};
    weeks.forEach((w) => {
      PROGRAM[w].days.forEach((d) => d.exercises.forEach((ex) => {
        if (!isWeightExercise(ex)) return;
        if (!seen[ex.id]) seen[ex.id] = { id: ex.id, name: ex.name };
      }));
    });
    return Object.values(seen).map((e) => ({
      ...e,
      data: getExerciseHistory(e.id).filter((h) => h.topWeight !== null).map((h) => ({ week: `W${h.week}`, weight: h.topWeight })),
    })).filter((e) => e.data.length >= 2);
  })();

  if (workoutSession) {
    const sessDay = program.days.find((d) => d.title === workoutSession.dayTitle);
    if (!sessDay) { setWorkoutSession(null); return null; }
    const exList = sessDay.exercises;
    const idx = Math.min(workoutSession.idx, exList.length - 1);
    const ex = exList[idx];
    const exDone = isExerciseComplete(week, ex);
    return (
      <div style={s.app}>
        <div style={s.sessionHeader}>
          <button style={s.sessionExit} onClick={() => setWorkoutSession(null)}>✕</button>
          <div style={s.sessionProgress}>{idx + 1} / {exList.length}</div>
          <div style={{ width: 32 }} />
        </div>
        <div style={s.sessionDayTitle}>{sessDay.title} · {sessDay.focus}</div>
        <main style={{ ...s.main, paddingTop: 0 }}>
          <div style={s.dayCard}>
            <div style={{ padding: 16 }}>{renderExercise(ex)}</div>
          </div>
        </main>
        <div style={s.sessionNav}>
          <button style={s.sessionNavBtn} disabled={idx === 0} onClick={() => setWorkoutSession({ ...workoutSession, idx: idx - 1 })}>← Prev</button>
          {idx < exList.length - 1 ? (
            <button style={{ ...s.sessionNavBtn, ...s.sessionNavPrimary }} onClick={() => setWorkoutSession({ ...workoutSession, idx: idx + 1 })}>Next →</button>
          ) : (
            <button style={{ ...s.sessionNavBtn, ...s.sessionNavPrimary }} onClick={() => setWorkoutSession(null)}>{exDone ? "Finish ✓" : "Finish"}</button>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={s.app}>
      <header style={s.header}>
        <div style={s.headerTop}>
          <div>
            <div style={s.eyebrow}>🏋️ TRAINING LOG</div>
            <h1 style={s.h1}>{view === "log" ? program.label : "Progress"}</h1>
          </div>
          <div title="Save status">
            {saveState === "saving" && <span style={s.savingDot} />}
            {saveState === "saved" && <span style={{ color: "#6FCF97", fontSize: 18 }}>✓</span>}
            {saveState === "error" && <span style={{ color: "#C0503A", fontSize: 16 }}>⚠</span>}
          </div>
        </div>

        {saveState === "error" && (
          <div style={s.errorBanner}>⚠ {saveError || "Save failed"}. Retrying automatically — check your connection.</div>
        )}

        <div style={s.tabRow}>
          <button style={{ ...s.tabBtn, ...(view === "log" ? s.tabBtnActive : {}) }} onClick={() => setView("log")}>🗓 Log</button>
          <button style={{ ...s.tabBtn, ...(view === "progress" ? s.tabBtnActive : {}) }} onClick={() => setView("progress")}>📈 Progress</button>
        </div>

        {view === "log" && (
          <React.Fragment>
            <div style={s.weekPicker}>
              {weeks.map((w) => (
                <button key={w} onClick={() => setWeek(w)} style={{ ...s.weekBtn, ...(w === week ? s.weekBtnActive : {}) }}>W{w}</button>
              ))}
            </div>
            <div style={s.progressRow}>
              <div style={s.progressBarTrack}><div style={{ ...s.progressBarFill, width: `${totalExercises ? (doneCount / totalExercises) * 100 : 0}%` }} /></div>
              <span style={s.progressLabel}>{doneCount}/{totalExercises}</span>
            </div>
            {(weekVolume > 0 || hardSets > 0) && <div style={s.volumeLabel}>{hardSets} hard set{hardSets===1?"":"s"} on main lifts{weekVolume > 0 ? ` \u00b7 ${Math.round(weekVolume).toLocaleString()} lb moved` : ""} this week</div>}
            {weekComplete && (
              <div style={s.completeBanner}>Week complete — message Claude for next week's plan.</div>
            )}
          </React.Fragment>
        )}
      </header>

      {view === "log" && (
        <main style={s.main}>
          {program.days.map((day) => {
            const isOpen = openDay === day.title;
            const dayCountable = countable(day);
            const dayDone = dayCountable.filter((e) => isExerciseComplete(week, e)).length;
            const sessNote = (logs[sessionNoteKey(week, day.title)] || {}).note || "";
            return (
              <section key={day.title} style={s.dayCard}>
                <button style={s.dayHeader} onClick={() => setOpenDay(isOpen ? null : day.title)}>
                  <div style={{ textAlign: "left" }}>
                    <div style={s.dayTitleRow}>
                      <span style={s.dayTitle}>{day.title.toUpperCase()}</span>
                      {day.title === todayName() && <span style={{ color: "#4FD9AE" }}>●</span>}
                    </div>
                    <div style={s.dayFocus}>{day.focus}</div>
                  </div>
                  <div style={s.dayHeaderRight}>
                    <span style={s.dayCount}>
                      {dayCountable.length === 0 ? "Flexible" : `${dayDone}/${dayCountable.length}`}
                      {dayVolume(day) > 0 ? ` · ${Math.round(dayVolume(day)).toLocaleString()} lb` : ""}
                    </span>
                    <span style={{ color: "#8CA39A" }}>{isOpen ? "▲" : "▼"}</span>
                  </div>
                </button>
                {isOpen && (
                  <div style={s.dayBody}>
                    {day.note && <div style={s.noteBox}>{day.note}</div>}
                    <div style={s.sessionNoteWrap}>
                      <div style={s.sessionNoteLabel}>SESSION NOTE</div>
                      <input
                        type="text"
                        value={sessNote}
                        onChange={(e) => updateSessionNote(day.title, e.target.value)}
                        placeholder="sleep, energy, travel, equipment..."
                        style={s.sessionNoteInput}
                      />
                    </div>
                    {dayCountable.length > 0 && (
                      <button style={s.startBtn} onClick={() => setWorkoutSession({ dayTitle: day.title, idx: 0 })}>▶ Start Workout</button>
                    )}
                    {day.exercises.map((ex) => renderExercise(ex))}
                  </div>
                )}
              </section>
            );
          })}
        </main>
      )}

      {view === "progress" && (
        <main style={s.main}>
          {chartExercises.length === 0 ? (
            <div style={s.emptyState}>
              <div style={{ fontSize: 32 }}>📈</div>
              <div style={s.emptyText}>Log the same lift across two or more weeks to see a trend here.</div>
            </div>
          ) : chartExercises.map((ce) => <MiniChart key={ce.id} title={ce.name} data={ce.data} />)}
        </main>
      )}

      <footer style={s.footer}><span style={s.saveIndicator}>🔗 Logged directly to your GitHub repo</span></footer>
    </div>
  );
}

function MiniChart({ title, data }) {
  const w = 320, h = 120, pad = 24;
  const weights = data.map((d) => d.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const range = max - min || 1;
  const points = data.map((d, i) => {
    const x = pad + (i / (data.length - 1 || 1)) * (w - pad * 2);
    const y = h - pad - ((d.weight - min) / range) * (h - pad * 2);
    return `${x},${y}`;
  });
  return (
    <div style={s.chartCard}>
      <div style={s.chartTitle}>{title}</div>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h}>
        <polyline points={points.join(" ")} fill="none" stroke="#4FD9AE" strokeWidth="2" />
        {data.map((d, i) => {
          const x = pad + (i / (data.length - 1 || 1)) * (w - pad * 2);
          const y = h - pad - ((d.weight - min) / range) * (h - pad * 2);
          return <circle key={i} cx={x} cy={y} r="3" fill="#4FD9AE" />;
        })}
        {data.map((d, i) => {
          const x = pad + (i / (data.length - 1 || 1)) * (w - pad * 2);
          return <text key={i} x={x} y={h - 6} fontSize="10" fill="#8CA39A" textAnchor="middle">{d.week}</text>;
        })}
      </svg>
    </div>
  );
}
