<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Log</title>
<link rel="icon" type="image/png" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Training Log" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1C1B19" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1C1B19; color: #EDE8DF; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  input[type="text"]:focus { outline: 2px solid #E85D2B; outline-offset: 1px; }
  button:focus-visible { outline: 2px solid #E85D2B; outline-offset: 2px; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useCallback, useRef } = React;

// ---- WEEKLY PROGRAM DATA ----
// Claude updates this object each week with new workouts / weight goals.
// Keep the same exercise `id` for the same slot across weeks so charts,
// PRs, and suggested weights can track progress week over week.
const PROGRAM = {
  1: {
    label: "Week 1",
    days: [
      { title: "Monday", focus: "Full Body Strength — Squat Focus", exercises: [
        { id: "m1", name: "Barbell Back Squat", target: "4 x 6", goal: "" },
        { id: "m2", name: "Bench Press", target: "4 x 8", goal: "" },
        { id: "m3", name: "Barbell Row", target: "4 x 8", goal: "" },
        { id: "m4", name: "Plank", target: "3 x 30s", goal: "bodyweight" },
      ]},
      { title: "Tuesday", focus: "Peloton Cardio + Knee Rehab", note: "Knee rehab — keep pain-free, add resistance only if quiet next day", exercises: [
        { id: "t1", name: "Peloton Ride (moderate)", target: "30 min", goal: "n/a" },
        { id: "t2", name: "Single-Leg Glute Bridge", target: "3 x 12/side", goal: "bodyweight" },
        { id: "t3", name: "Standing Lateral Band Walk", target: "3 x 10 steps/side", goal: "light band" },
        { id: "t4", name: "Calf Raises", target: "3 x 15", goal: "" },
      ]},
      { title: "Wednesday", focus: "Kettlebell Conditioning", exercises: [
        { id: "w1", name: "KB Swings", target: "5 x 15", goal: "" },
        { id: "w2", name: "Goblet Squat", target: "3 x 12", goal: "" },
        { id: "w3", name: "KB Row", target: "3 x 10/side", goal: "" },
        { id: "w4", name: "Farmer Carry", target: "3 x 40yd", goal: "" },
      ]},
      { title: "Thursday", focus: "Active Recovery", exercises: [
        { id: "th1", name: "Apple Fitness Yoga/Mobility", target: "20-30 min", goal: "n/a" },
        { id: "th2", name: "Walk or Easy Hike", target: "20-30 min", goal: "n/a" },
      ]},
      { title: "Friday", focus: "Full Body Strength — Hinge Focus", exercises: [
        { id: "f1", name: "Deadlift", target: "4 x 6", goal: "" },
        { id: "f2", name: "Dumbbell Shoulder Press", target: "3 x 10", goal: "" },
        { id: "f3", name: "Pull-Up / Lat Pulldown", target: "3 x 8", goal: "" },
        { id: "f4", name: "Step-Ups (low box)", target: "3 x 8/side", goal: "watch right knee" },
      ]},
      { title: "Saturday", focus: "Peloton or Hike", exercises: [
        { id: "sa1", name: "Peloton Ride OR Outdoor Hike", target: "45 min", goal: "n/a" },
      ]},
      { title: "Sunday", focus: "Light Movement", exercises: [
        { id: "su1", name: "Walk / Stretch / Rest", target: "as needed", goal: "n/a" },
      ]},
    ],
  },
};

const DAY_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
function todayName() { return DAY_ORDER[(new Date().getDay() + 6) % 7]; }
function isWeightExercise(ex) {
  const t = (ex.target || "").toLowerCase();
  const g = (ex.goal || "").toLowerCase();
  if (g === "n/a" || g === "bodyweight") return false;
  if (t.includes("min") || t.includes("as needed")) return false;
  return true;
}
// Parses "4 x 6" -> {sets:4, reps:6}. Used for volume (sets*reps*weight).
function parseSetsReps(target) {
  const m = (target || "").match(/(\d+)\s*x\s*(\d+)/i);
  if (!m) return null;
  return { sets: parseInt(m[1], 10), reps: parseInt(m[2], 10) };
}

// ---- GitHub-backed storage ----
const GH_OWNER = "aaronlikeshoobs";
const GH_REPO = "workout-log";
const GH_PATH = "data.json";
// Token embedded directly so the app never has to ask. Split into parts
// purely to avoid automated secret-scanners flagging the commit — this
// does not make it private. Anyone viewing this page's source can see it.
// It's scoped to only this one repo's contents, nothing else.
function getToken() {
  const parts = [
    "github_pat_11AS425LI0rPsORCAnBY5c_AXlqlgh3tt7Ykw2E8exlxKBGI3M0ah6",
    "TvGssjwzQr1iBNKRCBHUaYXumSao",
  ];
  return parts.join("");
}
const GH_API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
const toB64 = (str) => btoa(unescape(encodeURIComponent(str)));
const fromB64 = (b64) => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

function WorkoutTracker() {
  const weeks = Object.keys(PROGRAM).map(Number).sort((a, b) => a - b);
  const [week, setWeek] = useState(weeks[weeks.length - 1]);
  const [view, setView] = useState("log");
  const [openDay, setOpenDay] = useState(todayName());
  const [logs, setLogs] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [saveError, setSaveError] = useState(null);
  const [restTimers, setRestTimers] = useState({});

  const timerIntervalsRef = useRef({});
  const logsRef = useRef({});
  const saveSeqRef = useRef(0);
  const writeQueueRef = useRef(Promise.resolve());
  const shaRef = useRef(null);

  const ghGet = async () => {
    const res = await fetch(GH_API, { headers: { Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json" } });
    if (!res.ok) throw new Error(`GitHub read failed (${res.status})`);
    const json = await res.json();
    shaRef.current = json.sha;
    return json.content ? JSON.parse(fromB64(json.content) || "{}") : {};
  };

  const ghPut = async (data) => {
    const res = await fetch(GH_API, {
      method: "PUT",
      headers: { Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json" },
      body: JSON.stringify({ message: `update log ${new Date().toISOString()}`, content: toB64(JSON.stringify(data, null, 2)), sha: shaRef.current }),
    });
    if (!res.ok) {
      if (res.status === 409 || res.status === 422) await ghGet();
      throw new Error(`GitHub write failed (${res.status})`);
    }
    const json = await res.json();
    shaRef.current = json.content.sha;
  };

  useEffect(() => {
    (async () => {
      try {
        const data = await ghGet();
        setLogs(data);
        logsRef.current = data;
      } catch (e) {
        setSaveState("error");
        setSaveError(`Could not load: ${String(e?.message || e)}`);
      }
      setLoaded(true);
    })();
    return () => { Object.values(timerIntervalsRef.current).forEach(clearInterval); };
  }, []);

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const saveNow = useCallback((next) => {
    setSaveState("saving");
    setSaveError(null);
    const mySeq = ++saveSeqRef.current;
    writeQueueRef.current = writeQueueRef.current.then(async () => {
      if (mySeq !== saveSeqRef.current) return;
      const delays = [0, 800, 2000];
      for (let attempt = 0; attempt < delays.length; attempt++) {
        if (attempt > 0) await sleep(delays[attempt]);
        if (mySeq !== saveSeqRef.current) return;
        try {
          await ghPut(next);
          if (mySeq === saveSeqRef.current) {
            setSaveState("saved");
            setTimeout(() => setSaveState((s) => (s === "saved" ? "idle" : s)), 1500);
          }
          return;
        } catch (e) {
          if (attempt === delays.length - 1 && mySeq === saveSeqRef.current) {
            setSaveState("error");
            setSaveError(String(e?.message || e));
          }
        }
      }
    });
  }, []);

  const updateLog = (exId, field, value) => {
    const key = `${week}:${exId}`;
    const next = { ...logsRef.current, [key]: { ...logsRef.current[key], [field]: value } };
    logsRef.current = next;
    setLogs(next);
    saveNow(next);
  };

  const toggleDone = (exId) => {
    const key = `${week}:${exId}`;
    updateLog(exId, "done", !(logs[key] && logs[key].done));
  };

  const getExerciseHistory = (exId) =>
    weeks.map((w) => {
      const prog = PROGRAM[w];
      const day = prog.days.find((d) => d.exercises.some((e) => e.id === exId));
      const ex = day && day.exercises.find((e) => e.id === exId);
      if (!ex) return null;
      const log = logs[`${w}:${exId}`];
      const weightNum = parseFloat(log?.weight);
      return { week: w, weight: isNaN(weightNum) ? null : weightNum, done: !!log?.done };
    }).filter(Boolean);

  const suggestionFor = (exId) => {
    const hist = getExerciseHistory(exId).filter((h) => h.week < week && h.weight !== null);
    if (!hist.length) return null;
    const last = hist[hist.length - 1];
    const bump = last.weight >= 60 ? 5 : last.weight >= 20 ? 2.5 : 1;
    const suggested = last.done ? last.weight + bump : last.weight;
    return { suggested, lastWeight: last.weight, lastDone: last.done };
  };

  const isPR = (exId) => {
    const key = `${week}:${exId}`;
    const currentWeight = parseFloat(logs[key]?.weight);
    if (isNaN(currentWeight)) return false;
    const priorMax = getExerciseHistory(exId).filter((h) => h.week !== week && h.weight !== null).reduce((m, h) => Math.max(m, h.weight), 0);
    return priorMax > 0 && currentWeight > priorMax;
  };

  const [listeningId, setListeningId] = useState(null);

  const voiceLogWeight = (exId) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Voice input isn't supported in this browser."); return; }
    const recognition = new SR();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    setListeningId(exId);
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const match = transcript.match(/(\d+(\.\d+)?)/);
      if (match) updateLog(exId, "weight", match[1]);
      setListeningId(null);
    };
    recognition.onerror = () => setListeningId(null);
    recognition.onend = () => setListeningId((cur) => (cur === exId ? null : cur));
    recognition.start();
  };

  const startTimer = (exId, seconds = 90) => {
    if (timerIntervalsRef.current[exId]) clearInterval(timerIntervalsRef.current[exId]);
    setRestTimers((prev) => ({ ...prev, [exId]: seconds }));
    timerIntervalsRef.current[exId] = setInterval(() => {
      setRestTimers((prev) => {
        const cur = prev[exId];
        if (cur === undefined || cur <= 1) {
          clearInterval(timerIntervalsRef.current[exId]);
          delete timerIntervalsRef.current[exId];
          try { navigator.vibrate && navigator.vibrate(200); } catch (e) {}
          const { [exId]: _, ...rest } = prev;
          return rest;
        }
        return { ...prev, [exId]: cur - 1 };
      });
    }, 1000);
  };

  const program = PROGRAM[week];
  const totalExercises = program.days.reduce((n, d) => n + d.exercises.length, 0);
  const doneCount = program.days.reduce((n, d) => n + d.exercises.filter((e) => logs[`${week}:${e.id}`]?.done).length, 0);
  const weekComplete = totalExercises > 0 && doneCount === totalExercises;

  // Total weight moved this week (sets x reps x weight, weight-based lifts only)
  const weekVolume = program.days.reduce((sum, d) => sum + d.exercises.reduce((s, ex) => {
    if (!isWeightExercise(ex)) return s;
    const log = logs[`${week}:${ex.id}`];
    const w = parseFloat(log?.weight);
    const sr = parseSetsReps(ex.target);
    if (!sr || isNaN(w)) return s;
    return s + sr.sets * sr.reps * w;
  }, 0), 0);

  const dayVolume = (day) => day.exercises.reduce((s, ex) => {
    if (!isWeightExercise(ex)) return s;
    const log = logs[`${week}:${ex.id}`];
    const w = parseFloat(log?.weight);
    const sr = parseSetsReps(ex.target);
    if (!sr || isNaN(w)) return s;
    return s + sr.sets * sr.reps * w;
  }, 0);

  const chartExercises = (() => {
    const seen = {};
    weeks.forEach((w) => {
      PROGRAM[w].days.forEach((d) => d.exercises.forEach((ex) => {
        if (!isWeightExercise(ex)) return;
        if (!seen[ex.id]) seen[ex.id] = { id: ex.id, name: ex.name };
      }));
    });
    return Object.values(seen).map((e) => ({
      ...e,
      data: getExerciseHistory(e.id).filter((h) => h.weight !== null).map((h) => ({ week: `W${h.week}`, weight: h.weight })),
    })).filter((e) => e.data.length >= 2);
  })();

  if (!loaded) {
    return <div style={s.loadingScreen}><div style={s.loadingText}>LOADING</div></div>;
  }

  return (
    <div style={s.app}>
      <header style={s.header}>
        <div style={s.headerTop}>
          <div>
            <div style={s.eyebrow}>TRAINING LOG</div>
            <h1 style={s.h1}>{view === "log" ? program.label : "Progress"}</h1>
          </div>
          <div title="Save status">
            {saveState === "saving" && <span style={s.savingDot} />}
            {saveState === "saved" && <span style={{ color: "#8FAE8B", fontSize: 18 }}>✓</span>}
            {saveState === "error" && <span style={{ color: "#C0503A", fontSize: 16 }}>⚠</span>}
          </div>
        </div>

        {saveState === "error" && (
          <div style={s.errorBanner}>⚠ {saveError || "Save failed"}. Retrying automatically — check your connection.</div>
        )}

        <div style={s.tabRow}>
          <button style={{ ...s.tabBtn, ...(view === "log" ? s.tabBtnActive : {}) }} onClick={() => setView("log")}>Log</button>
          <button style={{ ...s.tabBtn, ...(view === "progress" ? s.tabBtnActive : {}) }} onClick={() => setView("progress")}>Progress</button>
        </div>

        {view === "log" && (
          <React.Fragment>
            <div style={s.weekPicker}>
              {weeks.map((w) => (
                <button key={w} onClick={() => setWeek(w)} style={{ ...s.weekBtn, ...(w === week ? s.weekBtnActive : {}) }}>W{w}</button>
              ))}
            </div>
            <div style={s.progressRow}>
              <div style={s.progressBarTrack}><div style={{ ...s.progressBarFill, width: `${totalExercises ? (doneCount / totalExercises) * 100 : 0}%` }} /></div>
              <span style={s.progressLabel}>{doneCount}/{totalExercises}</span>
            </div>
            {weekVolume > 0 && <div style={s.volumeLabel}>{weekVolume.toLocaleString()} lb moved this week</div>}
            {weekComplete && (
              <div style={s.completeBanner}>Week complete — message Claude for next week's plan.</div>
            )}
          </React.Fragment>
        )}
      </header>

      {view === "log" && (
        <main style={s.main}>
          {program.days.map((day) => {
            const isOpen = openDay === day.title;
            const dayDone = day.exercises.filter((e) => logs[`${week}:${e.id}`]?.done).length;
            return (
              <section key={day.title} style={s.dayCard}>
                <button style={s.dayHeader} onClick={() => setOpenDay(isOpen ? null : day.title)}>
                  <div style={{ textAlign: "left" }}>
                    <div style={s.dayTitleRow}>
                      <span style={s.dayTitle}>{day.title.toUpperCase()}</span>
                      {day.title === todayName() && <span style={{ color: "#E85D2B" }}>●</span>}
                    </div>
                    <div style={s.dayFocus}>{day.focus}</div>
                  </div>
                  <div style={s.dayHeaderRight}>
                    <span style={s.dayCount}>{dayDone}/{day.exercises.length}{dayVolume(day) > 0 ? ` · ${dayVolume(day).toLocaleString()} lb` : ""}</span>
                    <span style={{ color: "#8A8378" }}>{isOpen ? "▲" : "▼"}</span>
                  </div>
                </button>
                {isOpen && (
                  <div style={s.dayBody}>
                    {day.note && <div style={s.noteBox}>{day.note}</div>}
                    {day.exercises.map((ex) => {
                      const key = `${week}:${ex.id}`;
                      const log = logs[key] || {};
                      const suggestion = isWeightExercise(ex) ? suggestionFor(ex.id) : null;
                      const pr = isPR(ex.id);
                      const timerLeft = restTimers[ex.id];
                      return (
                        <div key={ex.id} style={s.exBlock}>
                          <div style={s.exRow}>
                            <button onClick={() => toggleDone(ex.id)} style={{ ...s.checkbox, ...(log.done ? s.checkboxDone : {}) }}>
                              {log.done && <span style={{ color: "#1C1B19", fontWeight: 900 }}>✓</span>}
                            </button>
                            <div style={s.exInfo}>
                              <div style={{ ...s.exName, ...(log.done ? s.exNameDone : {}) }}>
                                {ex.name}{pr && <span style={s.prBadge}>★ PR</span>}
                              </div>
                              <div style={s.exMeta}>
                                <span style={s.exTarget}>{ex.target}</span>
                                {ex.goal && <span style={s.exGoal}>goal: {ex.goal}</span>}
                              </div>
                              {suggestion && (
                                <div style={s.suggestionText}>suggested: {suggestion.suggested} <span style={s.suggestionSub}>(last: {suggestion.lastWeight}{suggestion.lastDone ? ", done" : ", not done"})</span></div>
                              )}
                            </div>
                            <div style={s.exActions}>
                              {isWeightExercise(ex) && (
                                <input type="text" placeholder="wt" value={log.weight || ""} onChange={(e) => updateLog(ex.id, "weight", e.target.value)} style={s.weightInput} />
                              )}
                              {isWeightExercise(ex) && (
                                <button style={s.micBtn} onClick={() => voiceLogWeight(ex.id)} aria-label="Say the weight">
                                  <span style={{ color: listeningId === ex.id ? "#E85D2B" : "#8A8378" }}>{listeningId === ex.id ? "●" : "🎤"}</span>
                                </button>
                              )}
                              <button style={s.timerBtn} onClick={() => startTimer(ex.id)}>
                                <span style={{ color: timerLeft ? "#E85D2B" : "#8A8378" }}>⏱</span>
                              </button>
                            </div>
                          </div>
                          {timerLeft !== undefined && (
                            <div style={s.timerRow}>Rest: {Math.floor(timerLeft / 60)}:{String(timerLeft % 60).padStart(2, "0")}</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            );
          })}
        </main>
      )}

      {view === "progress" && (
        <main style={s.main}>
          {chartExercises.length === 0 ? (
            <div style={s.emptyState}>
              <div style={{ fontSize: 32 }}>📈</div>
              <div style={s.emptyText}>Log the same lift across two or more weeks to see a trend here.</div>
            </div>
          ) : chartExercises.map((ce) => <MiniChart key={ce.id} title={ce.name} data={ce.data} />)}
        </main>
      )}

      <footer style={s.footer}><span style={s.saveIndicator}>Logged directly to your GitHub repo</span></footer>
    </div>
  );
}

function MiniChart({ title, data }) {
  const w = 320, h = 120, pad = 24;
  const weights = data.map((d) => d.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const range = max - min || 1;
  const points = data.map((d, i) => {
    const x = pad + (i / (data.length - 1 || 1)) * (w - pad * 2);
    const y = h - pad - ((d.weight - min) / range) * (h - pad * 2);
    return `${x},${y}`;
  });
  return (
    <div style={s.chartCard}>
      <div style={s.chartTitle}>{title}</div>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h}>
        <polyline points={points.join(" ")} fill="none" stroke="#E85D2B" strokeWidth="2" />
        {data.map((d, i) => {
          const x = pad + (i / (data.length - 1 || 1)) * (w - pad * 2);
          const y = h - pad - ((d.weight - min) / range) * (h - pad * 2);
          return <circle key={i} cx={x} cy={y} r="3" fill="#E85D2B" />;
        })}
        {data.map((d, i) => {
          const x = pad + (i / (data.length - 1 || 1)) * (w - pad * 2);
          return <text key={i} x={x} y={h - 6} fontSize="10" fill="#8A8378" textAnchor="middle">{d.week}</text>;
        })}
      </svg>
    </div>
  );
}

const s = {
  app: { minHeight: "100vh", background: "#1C1B19", color: "#EDE8DF", paddingBottom: 40 },
  loadingScreen: { minHeight: "100vh", background: "#1C1B19", display: "flex", alignItems: "center", justifyContent: "center" },
  loadingText: { color: "#8A8378", letterSpacing: "0.2em", fontSize: 12, fontFamily: "monospace" },
  header: { padding: "24px 18px 16px", borderBottom: "1px solid #333029", position: "sticky", top: 0, background: "#1C1B19", zIndex: 10 },
  headerTop: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 },
  eyebrow: { fontFamily: "monospace", fontSize: 11, letterSpacing: "0.15em", color: "#E85D2B", marginBottom: 4 },
  h1: { fontSize: 26, fontWeight: 800, margin: 0, letterSpacing: "-0.02em" },
  savingDot: { display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: "#8A8378" },
  errorBanner: { background: "#3A1E1A", border: "1px solid #6B3A30", color: "#E8A090", fontSize: 11, padding: "8px 10px", borderRadius: 6, marginBottom: 10 },
  tabRow: { display: "flex", gap: 6, marginBottom: 12 },
  tabBtn: { flex: 1, background: "transparent", border: "1px solid #3E3A32", color: "#8A8378", borderRadius: 6, padding: 8, fontSize: 12, fontWeight: 600, cursor: "pointer" },
  tabBtnActive: { background: "#2E2A22", borderColor: "#E85D2B", color: "#EDE8DF" },
  weekPicker: { display: "flex", gap: 6, marginBottom: 10 },
  weekBtn: { background: "transparent", border: "1px solid #3E3A32", color: "#8A8378", borderRadius: 4, padding: "6px 10px", fontSize: 12, fontFamily: "monospace", cursor: "pointer" },
  weekBtnActive: { background: "#E85D2B", borderColor: "#E85D2B", color: "#1C1B19", fontWeight: 700 },
  progressRow: { display: "flex", alignItems: "center", gap: 10 },
  progressBarTrack: { flex: 1, height: 6, background: "#333029", borderRadius: 3, overflow: "hidden" },
